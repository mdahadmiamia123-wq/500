<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your 500 Bonus Points</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e272e 0%, #0f1519 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .landing-card {
            background: #2f3640;
            max-width: 420px;
            width: 100%;
            padding: 40px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid #485460;
        }
        .badge {
            background: #ffdd59;
            color: #1e272e;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .icon-box {
            font-size: 55px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            line-height: 1.3;
            color: #ffffff;
        }
        .highlight {
            color: #0be881;
            font-weight: 800;
        }
        p {
            font-size: 15px;
            color: #dcdde1;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .claim-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0be881 0%, #05c46b 100%);
            color: #1e272e;
            font-size: 19px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(11, 232, 129, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(11, 232, 129, 0.45);
        }
        .claim-btn:active {
            transform: scale(0.98);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #808e9b;
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <div class="badge">🎁 Limited Time Offer</div>
        <div class="icon-box">💎</div>
        <h1>Sign Up & Collect <span class="highlight">500 Points</span> Instantly!</h1>
        <p>Join now and claim your welcome reward. Click the button below to get started immediately.</p>
        
        <!-- বাটনে ক্লিক করলে আপনার অ্যাড লিংক ওপেন হবে -->
        <button class="claim-btn" onclick="openAdLink()">CLAIM 500 POINTS NOW</button>

        <div class="footer-note">🔒 Safe & Verified Reward Portal</div>
    </div>

    <script>
        function openAdLink() {
            // আপনার সেট করা অ্যাড লিংক
            const myAdUrl = "https://ashamed-employer.com/B5UwgL"; 
            window.location.href = myAdUrl;
        }
    </script>

</body>
</html>
